# What the supply-chain job refuses. See docs/development.md.
[advisories]
version = 2
yanked = "deny"
# Each has no fixed version to move to. Reviewed, not forgotten: remove an
# entry as soon as its dependency moves on.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa timing leak in private-key operations; used through yara-x, which has no private key here" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; through yara-x" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; a compile-time macro, through ratatui" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; through serde_yaml, to be replaced: it reads Sigma rules" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD"]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
