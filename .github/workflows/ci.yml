name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Tests must never touch a developer's real settings.
  XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --release --locked
      - name: Parser fuzzing (smoke, fixed seed)
        run: cargo test --release --locked fuzz_ -- --ignored
        env:
          PW_FUZZ_ITERATIONS: "3000"
      - name: Self-test (measured capture rates etc.)
        timeout-minutes: 5
        run: ./target/release/procwatch --selftest
        shell: bash
      - name: Self-test as root (kernel process events)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo -E ./target/release/procwatch --selftest
        shell: bash
      - name: Soak test (2 minutes, headless)
        timeout-minutes: 8
        run: ./target/release/procwatch --soak 2
        shell: bash
      - name: Content rules and Sigma rules parse
        run: ./target/release/procwatch --check-rules rules/sigma
        shell: bash
